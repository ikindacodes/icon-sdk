<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Icon SDK proof</title>
    <style>
      body {
        margin: 24px;
        font-family: "Segoe UI", sans-serif;
        color: #17211c;
        background: #f7f6f3;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 24px;
      }

      .panels {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
      }

      section {
        padding: 16px;
        background: #fff;
        border: 1px solid #d5d2cb;
      }

      h2 {
        margin: 0 0 12px;
        font-size: 16px;
      }

      svg {
        width: 96px;
        height: 96px;
        color: #14221f;
      }

      p {
        margin: 12px 0 0;
      }
    </style>
  </head>
  <body>
    <h1>Icon SDK proof</h1>
    <div class="panels">
      <section id="static">
        <h2>Static check</h2>
        <div data-mount></div>
        <p data-label></p>
      </section>
      <section id="drawn">
        <h2>Stroke draw</h2>
        <div data-mount></div>
        <p data-label></p>
      </section>
      <section id="reduced">
        <h2>Reduced motion</h2>
        <div data-mount></div>
        <p data-label></p>
      </section>
      <section id="live">
        <h2>Live preference</h2>
        <div data-mount></div>
        <p data-label></p>
      </section>
    </div>
    <script type="module" src="./proof.js"></script>
  </body>
</html>
